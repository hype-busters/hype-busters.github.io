<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting to Epistemic Stance Survey…</title>
  <link rel="icon" type="image/png" href="../assets/images/hype_favicon.png" />
  <!--
    The full survey (intro, practice screening, demographics, BWS quizzes)
    now runs on the private BWScaling app. This public page only forwards
    participants (and Prolific query params) there.

    Target: https://bwscaling.hype-busters.com/start
    DNS for that hostname is managed at the domain registrar — not here.
  -->
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0a0a0a;
      color: #eee;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 440px;
      line-height: 1.6;
    }
    a { color: #9ecbff; }
    .muted { color: #999; font-size: 0.95em; }
  </style>
  <script>
    (function () {
      var BASE = 'https://bwscaling.hype-busters.com/start';
      try {
        var incoming = new URLSearchParams(window.location.search);
        var out = new URLSearchParams();
        ['PROLIFIC_PID', 'prolific_pid', 'STUDY_ID', 'study_id', 'SESSION_ID', 'session_id'].forEach(function (key) {
          var v = incoming.get(key);
          if (v) {
            // Normalise to Prolific's canonical upper-case names when possible
            if (key.toLowerCase() === 'prolific_pid') out.set('PROLIFIC_PID', v);
            else if (key.toLowerCase() === 'study_id') out.set('STUDY_ID', v);
            else if (key.toLowerCase() === 'session_id') out.set('SESSION_ID', v);
            else out.set(key, v);
          }
        });
        out.set('source', 'hype-busters-epistemic-stance');
        var target = out.toString() ? BASE + '?' + out.toString() : BASE;
        // Immediate redirect
        window.location.replace(target);
        // Fallback link if replace is blocked
        document.addEventListener('DOMContentLoaded', function () {
          var a = document.getElementById('fallback');
          if (a) a.href = target;
        });
      } catch (e) {
        window.location.replace(BASE);
      }
    })();
  </script>
</head>
<body>
  <div class="card">
    <p>Redirecting you to the Epistemic Stance survey…</p>
    <p class="muted">
      If nothing happens,
      <a id="fallback" href="https://bwscaling.hype-busters.com/start">continue here</a>.
    </p>
  </div>
</body>
</html>
